name: Validate brand assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assets:
    name: Rebuild and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run verify
      - name: Generated files match committed files
        run: |
          git diff --exit-code -- assets docs/asset-preview.svg docs/asset-preview.png
          test -z "$(git ls-files --others --exclude-standard assets docs/asset-preview.svg docs/asset-preview.png)"
